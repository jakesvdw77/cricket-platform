    <!-- crease -->
    <path d="M80 228 H176" stroke="#FFFFFF" stroke-width="3"/>
    <path d="M116 156 H140" stroke="#FFFFFF" stroke-width="1.5"/>
    <!-- far stumps -->
    <g fill="#F7F3E8"><rect x="123" y="138" width="2" height="16"/><rect x="127" y="138" width="2" height="16"/><rect x="131" y="138" width="2" height="16"/></g>
    <!-- near stumps -->
    <g fill="#FFFFFF" stroke="#8C6E3A" stroke-width="1.5">
      <rect x="107" y="170" width="8" height="58" rx="2"/>
      <rect x="124" y="170" width="8" height="58" rx="2"/>
      <rect x="141" y="170" width="8" height="58" rx="2"/>
    </g>
    <!-- bails -->
    <rect x="105" y="164" width="23" height="5" rx="2.5" fill="#C8102E"/>
    <rect x="128" y="164" width="23" height="5" rx="2.5" fill="#C8102E"/>
