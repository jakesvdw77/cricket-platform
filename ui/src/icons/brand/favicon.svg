<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- pitch-green tile -->
  <rect width="64" height="64" rx="14" fill="#0F5132"/>
  <!-- bat (handle top-left, blade toward bottom-right) -->
  <g transform="rotate(-45 32 32)">
    <rect x="29.5" y="6" width="5" height="14" rx="2.5" fill="#1B1B1B"/>
    <rect x="25" y="19" width="14" height="38" rx="5" fill="#F4E4BC"/>
    <rect x="31" y="22" width="2" height="31" rx="1" fill="#D9C08A"/>
  </g>
  <!-- ball -->
  <circle cx="46" cy="18" r="10" fill="#C8102E"/>
  <path d="M39 11.5 Q46 18 53 24.5" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-dasharray="2 1.6" stroke-linecap="round"/>
  <circle cx="43" cy="15" r="2.6" fill="#FFFFFF" opacity="0.25"/>
</svg>
