# Cricket Legend login theme. Extends Keycloak's stock "keycloak" login theme (24.0.3), so every
# template we do not override keeps working and a Keycloak upgrade cannot break us through a
# copied .ftl. The stock styles stay first; our stylesheet re-skins them.
parent=keycloak
styles=css/login.css css/cricketlegend.css
locales=en

# Optional: where the "Back To Application" link on info pages goes when the client has no Home URL (leave blank to rely on the
# client Home URL in Keycloak). Example: appUrl=https://app.example.com/post-login
appUrl=
