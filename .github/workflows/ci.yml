name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build and test
        run: mvn -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  # e2e-smoke: docs/specs/004-landing-page.md's two golden paths (lead-capture submission,
  # find-your-club login redirect), against real backend + frontend dev servers — Testcontainers
  # doesn't help here since Playwright needs an actual running HTTP server to drive a browser
  # against. Keycloak itself is deliberately NOT started: the golden paths this job covers never
  # exercise an authenticated endpoint, and SecurityConfig's JwtDecoder resolves its issuer
  # lazily on first use, not at boot, so the backend starts fine with only Postgres up.
  e2e-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cricketlegend_platform
          POSTGRES_USER: cricket
          POSTGRES_PASSWORD: legend
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cricket -d cricketlegend_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KEYCLOAK_ISSUER_URI: http://127.0.0.1:1/realms/unused-in-e2e-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Start backend (dev profile, against the Postgres service container)
        working-directory: backend
        run: |
          nohup ./mvnw -B spring-boot:run -Dspring-boot.run.profiles=dev > backend.log 2>&1 &
          echo "Waiting for backend on :8082..."
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:8082/api/v1/public/clubs?query=a" > /dev/null; then
              echo "Backend is up."
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed to start in time." >&2
          cat backend.log
          exit 1

      - name: Seed one ACTIVE club fixture for the find-your-club golden path
        run: |
          PGPASSWORD=legend psql -h localhost -U cricket -d cricketlegend_platform -c \
            "INSERT INTO club (name, slug, status) VALUES ('Riverside CC', 'riverside', 'ACTIVE') ON CONFLICT (slug) DO NOTHING;"

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ui
        run: npx playwright install --with-deps chromium

      - name: Start frontend dev server
        working-directory: ui
        run: |
          nohup npm run dev -- --port 5173 --strictPort > frontend.log 2>&1 &
          echo "Waiting for frontend on :5173..."
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:5173/" > /dev/null; then
              echo "Frontend is up."
              exit 0
            fi
            sleep 2
          done
          echo "Frontend failed to start in time." >&2
          cat frontend.log
          exit 1

      - name: Run Playwright e2e golden-path tests
        working-directory: ui
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 7
