    post:
      tags:
      - result-import-controller
      operationId: preview
      description: "Runs the chosen adaptor over a file or pasted content, then proposes the matches in the club's fixtures it could belong to and the side of each file team (docs/specs/104). Multipart: the JSON part request and an optional file part; exactly one of the file and request.content (paste, text based formats only). Reads and proposes; writes nothing. 400 for an unsupported format, an unreadable input or a document that does not follow the common import format (errors, totalErrors); 404 for a matchId of another club."
