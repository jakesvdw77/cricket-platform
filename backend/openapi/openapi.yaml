      properties:
        acknowledgedWarnings:
          type: boolean
    ResultIssueDto:
      type: object
      description: "One validation issue (docs/specs/101): a stable code (a ResultValidator ErrorCode or WarningCode name; docs/specs/104 adds the error IMPORTED_NAME_UNCONFIRMED, step TEAMS, one per imported player link not yet confirmed; docs/specs/113 adds the errors PLAYER_NOT_IN_SECTION and PLAYER_AGE_INELIGIBLE, step TEAMS with the side, one per registered player of our side outside the team's section or outside the league's age rule), the wizard step to fix it on, the scorecard side it belongs to (null for match-level issues) and its severity. INFO never blocks and needs no acknowledgement."
      properties:
        code:
          type: string
        step:
          type: string
          enum:
          - RESULT
          - TOSS
          - SCORES
          - TEAMS
          - BATTING
          - BOWLING
          - AWARDS
        side:
          type: string
          enum:
          - HOME
          - AWAY
        severity:
          type: string
          enum:
          - ERROR
          - WARNING
          - INFO
        message:
          type: string
        playerProfileId:
          type: string
          format: uuid
          description: "The player the issue is about (docs/specs/118); set on PLAYER_NOT_IN_SQUAD, absent/null on every other issue."
    ResultPlayerDto:
      type: object
      description: "Who played for a side (docs/specs/101): one of our sides, or the opposition as typed names. On write send id for a player already on the scorecard, or a new clientKey that entries refer to; firstName, lastName, guest, linkedBy and linkedAt are read-only. A guest has no playerProfileId and a displayName."
      properties:
        id:
          type: string
          format: uuid
        clientKey:
          type: string
        side:
          type: string
          enum:
          - HOME
          - AWAY
        playerProfileId:
          type: string
          format: uuid
        displayName:
          type: string
        plannedBattingOrder:
          type: integer
          format: int32
        replacedPlayerProfileId:
          type: string
          format: uuid
        substitute:
          type: boolean
        opposition:
          type: boolean
          description: "True for a player of the side that is not ours: a name only (no playerProfileId, plannedBattingOrder or replacedPlayerProfileId), validated against the match; never linkable. guest is false for one."
        firstName:
          type: string
        lastName:
          type: string
        guest:
          type: boolean
        linkedBy:
          type: string
          format: uuid
        linkedAt:
          type: string
          format: date-time
        importMatch:
          type: string
          enum:
          - NORMALISED
          - AI_SUGGESTED
          description: "docs/specs/104: set by an import on one of our players linked by a rule other than an exact match or a remembered alias (a guess to confirm before publishing, ResultValidator error IMPORTED_NAME_UNCONFIRMED). Read; on write it can only be kept or cleared (null): a client can never set or raise it. Confirming, changing the player, linking or removing the row clears it. AI_SUGGESTED is reserved and never produced."
    BattingEntryDto:
      type: object
      description: "One batter of our side in the regular innings in which battingSide batted (docs/specs/101). position is the actual batting order. suggested and featured are read-only (the standout rules and the effective value, frozen at publish); the manager writes only featuredOverride. inningsKind SUPER_OVER is refused."
      properties:
        id:
          type: string
          format: uuid
        battingSide:
          type: string
          enum:
          - HOME
          - AWAY
        inningsKind:
          type: string
          enum:
          - REGULAR
          - SUPER_OVER
        resultPlayerId:
          type: string
          format: uuid
        playerClientKey:
          type: string
        position:
          type: integer
          format: int32
        howOut:
          type:
          - string
          - "null"
          description: "Null in a draft means batted, how out not chosen yet; such a row blocks publishing (HOW_OUT_MISSING)."
          enum:
          - NOT_OUT
          - DID_NOT_BAT
          - BOWLED
          - CAUGHT
          - CAUGHT_AND_BOWLED
          - LBW
          - STUMPED
          - RUN_OUT
          - HIT_WICKET
          - HANDLED_BALL
          - OBSTRUCTING_FIELD
          - HIT_BALL_TWICE
          - TIMED_OUT
          - RETIRED_NOT_OUT
          - RETIRED_OUT
        runs:
          type: integer
          format: int32
        balls:
          type: integer
          format: int32
        fours:
          type: integer
          format: int32
        sixes:
          type: integer
          format: int32
        bowlerPlayerId:
          type: string
          description: "The dismissal's bowler: the id of a player on the scorecard, or the clientKey of a new player in the same body, or null. A player of the fielding side of the innings, and only where howOut allows a bowler (BOWLED, CAUGHT, CAUGHT_AND_BOWLED, LBW, STUMPED, HIT_WICKET). On read an id."
        fielderPlayerId:
          type: string
          description: "The dismissal's fielder (catcher, keeper who stumped, run-out fielder): an id or a clientKey as bowlerPlayerId. Only for CAUGHT, STUMPED and RUN_OUT. On read an id."
        featuredOverride:
          type: string
          enum:
          - FEATURE
          - HIDE
        suggested:
          type: boolean
        featured:
          type: boolean
    BowlingEntryDto:
      type: object
      description: "One bowler of our side in the innings in which battingSide (the other side) batted (docs/specs/101). balls is balls bowled, never decimal overs."
      properties:
        id:
          type: string
          format: uuid
        battingSide:
          type: string
          enum:
          - HOME
          - AWAY
        inningsKind:
          type: string
          enum:
          - REGULAR
          - SUPER_OVER
        resultPlayerId:
          type: string
          format: uuid
        playerClientKey:
          type: string
        bowlingOrder:
          type: integer
          format: int32
        balls:
          type: integer
          format: int32
        maidens:
          type: integer
          format: int32
        runs:
          type: integer
          format: int32
        wickets:
          type: integer
          format: int32
        wides:
          type: integer
          format: int32
        noBalls:
          type: integer
          format: int32
        dots:
          type: integer
          format: int32
          description: "Dot balls bowled, optional; at most balls (DOTS_EXCEED_BALLS on save)."
        wicketsSource:
          type: string
          enum:
          - MANUAL
          - DERIVED
          description: "DERIVED: wickets is recomputed from the dismissals on every save (the sent number is ignored); MANUAL (default): never touched."
        featuredOverride:
          type: string
          enum:
          - FEATURE
          - HIDE
        suggested:
          type: boolean
        featured:
          type: boolean
        derivedWickets:
          type: integer
          format: int32
          description: "Read-only: the wickets the dismissals credit this bowler, always computed."
    FieldingEntryDto:
      type: object
      description: "One fielder of our side in the innings in which battingSide (the other side) batted (docs/specs/101)."
      properties:
        id:
          type: string
          format: uuid
        battingSide:
          type: string
          enum:
          - HOME
          - AWAY
        inningsKind:
          type: string
          enum:
          - REGULAR
          - SUPER_OVER
        resultPlayerId:
          type: string
          format: uuid
        playerClientKey:
          type: string
        catches:
          type: integer
          format: int32
        stumpings:
          type: integer
          format: int32
        runOuts:
          type: integer
          format: int32
        creditsSource:
          type: string
          enum:
          - MANUAL
          - DERIVED
          description: "DERIVED: the three counters are recomputed from the dismissals on every save (a row whose credits fall to zero is removed); MANUAL (default): never touched."
        featuredOverride:
          type: string
          enum:
          - FEATURE
          - HIDE
        suggested:
          type: boolean
        featured:
          type: boolean
        derivedCatches:
          type: integer
          format: int32
          description: "Read-only: the catches the dismissals credit this fielder (a caught-and-bowled credits the bowler)."
        derivedStumpings:
          type: integer
          format: int32
        derivedRunOuts:
          type: integer
          format: int32
    MatchAwardDto:
      type: object
      description: "Player of the match (docs/specs/101): PLAYER_OF_MATCH is the official one (one per result), TEAM_PLAYER_OF_MATCH the club team own (one per ours side). resultPlayerId or playerClientKey names a player on the scorecard (the official award may name an opposition player; the team award is ours only); displayName is free text for anyone not on a list, and on save the server always copies the named player's name into it so the award keeps the name if the row is removed; playerName is read-only."
      properties:
        id:
          type: string
          format: uuid
        awardType:
          type: string
          enum:
          - PLAYER_OF_MATCH
          - TEAM_PLAYER_OF_MATCH
        side:
          type: string
          enum:
          - HOME
          - AWAY
        resultPlayerId:
          type: string
          format: uuid
        playerClientKey:
          type: string
        displayName:
          type: string
        playerName:
          type: string
    ScorecardInningsDto:
      type: object
      description: "Read-only extras breakdown and non-bowler wickets of one innings as the scorecard read reports them (written through InningsDto on the result)."
      properties:
        battingSide:
          type: string
          enum:
          - HOME
          - AWAY
        wides:
          type: integer
          format: int32
        noBalls:
          type: integer
          format: int32
        byes:
          type: integer
          format: int32
        legByes:
          type: integer
          format: int32
        penaltyRuns:
          type: integer
          format: int32
        extras:
          type: integer
          format: int32
        nonBowlerWickets:
          type: integer
          format: int32
        nonBowlerWicketsDerived:
          type: boolean
          description: "True when the innings has batting entries: nonBowlerWickets is then derived from the dismissals on every save and the input is read-only."
    ScorecardSideStatusDto:
      type: object
      description: "How complete one side scorecard is (docs/specs/101); both sides are reported. A team list alone is PARTIAL."
      properties:
        side:
          type: string
          enum:
          - HOME
          - AWAY
        status:
          type: string
          enum:
          - NONE
          - PARTIAL
          - COMPLETE
    ScorecardDto:
      type: object
      description: "The scorecard (docs/specs/101): our side(s) and, as typed names, the opposition. The optional scorecard of a ResultDraft: absent means untouched, present replaces the whole draft scorecard in one transaction. On write innings and status are ignored."
      properties:
        players:
          type: array
          items:
            $ref: "#/components/schemas/ResultPlayerDto"
        batting:
          type: array
          items:
            $ref: "#/components/schemas/BattingEntryDto"
        bowling:
          type: array
          items:
            $ref: "#/components/schemas/BowlingEntryDto"
        fielding:
          type: array
          items:
            $ref: "#/components/schemas/FieldingEntryDto"
        awards:
          type: array
          items:
            $ref: "#/components/schemas/MatchAwardDto"
        innings:
          type: array
          items:
            $ref: "#/components/schemas/ScorecardInningsDto"
        status:
          type: array
          items:
            $ref: "#/components/schemas/ScorecardSideStatusDto"
    ScorecardPrefillPlayerDto:
      type: object
      description: "A selected player proposed for the scorecard line-up (docs/specs/101); plannedBattingOrder is null for a player without an order and for the 12th man (substitute true)."
      properties:
        playerProfileId:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        plannedBattingOrder:
          type: integer
          format: int32
        role:
          type: string
          enum:
          - BATSMAN
          - BOWLER
          - ALL_ROUNDER
        substitute:
          type: boolean
    ScorecardPrefillSideDto:
      type: object
      description: "The proposed line-up of one ours side from the team selection, in batting order (docs/specs/101); players is empty when no team was selected."
      properties:
        side:
          type: string
          enum:
          - HOME
          - AWAY
        teamId:
          type: string
          format: uuid
        teamName:
          type: string
        players:
          type: array
          items:
            $ref: "#/components/schemas/ScorecardPrefillPlayerDto"
        selectionState:
          type: string
          enum:
          - NONE
          - NOT_ANNOUNCED
          - ANNOUNCED
          description: "NONE: no selection found for this team; NOT_ANNOUNCED: a selection exists but is not announced; ANNOUNCED. Drives the not-selected notice."
    ScorecardPrefillDto:
      type: object
      description: "The proposed line-up per ours side of a match, from the selection (docs/specs/101): two entries in a derby. Writes nothing."
      properties:
        sides:
          type: array
          items:
            $ref: "#/components/schemas/ScorecardPrefillSideDto"
    LinkResultPlayerRequest:
      type: object
      description: "Link an unlinked scorecard player to a registered player of this club (docs/specs/101)."
      properties:
        playerProfileId:
          type: string
          format: uuid
    GuestNameDto:
      type: object
      description: "A guest name the club has used before, for the name field suggestions (docs/specs/101)."
      properties:
        displayName:
          type: string
        uses:
          type: integer
          format: int64
        lastUsed:
          type: string
          format: date-time
    AdaptorCatalogueDto:
      type: object
      description: "The registered import adaptors (by display name) and the import limits (docs/specs/104)."
      properties:
        adaptors:
          type: array
          items:
            $ref: "#/components/schemas/AdaptorDescriptorDto"
        limits:
          $ref: "#/components/schemas/ImportLimitsDto"
    AdaptorDescriptorDto:
      type: object
      description: "What the UI needs to offer one import adaptor (docs/specs/104). aiAllowed is always false in this revision; example is a short sample input for a text format, or null."
      properties:
        type:
          type: string
          enum:
          - JSON
          - CRICCLUBS_CSV
          - STUMPS_PDF
        displayName:
          type: string
        description:
          type: string
        inputs:
          type: array
          items:
            $ref: "#/components/schemas/InputFormatDto"
        aiAllowed:
          type: boolean
        example:
          type: string
          nullable: true
        conversionPrompt:
          type: string
          nullable: true
          description: "Text a manager copies into their own AI chat with their scorecard to get a document in this format, or null. The platform sends it nowhere."
    InputFormatDto:
      type: object
      description: "One input format an adaptor accepts (docs/specs/104). acceptsPaste equals textBased; maxBytes is the largest upload."
      properties:
        format:
          type: string
          enum:
          - JSON
          - CSV
          - EXCEL
          - PDF
        textBased:
          type: boolean
        extensions:
          type: array
          items:
            type: string
        maxBytes:
          type: integer
          format: int64
        acceptsPaste:
          type: boolean
    ImportLimitsDto:
      type: object
      description: "The import size caps (docs/specs/104), so the UI never hard-codes them."
      properties:
        maxPasteCharacters:
          type: integer
          format: int32
        maxFileBytes:
          type: integer
          format: int64
        maxPlayersPerSide:
          type: integer
          format: int32
        maxRegularInnings:
          type: integer
          format: int32
        maxNameLength:
          type: integer
          format: int32
        maxReportedErrors:
          type: integer
          format: int32
    ImportErrorDto:
      type: object
      description: "One problem in an import input, in plain English (docs/specs/104). path locates it in the document (empty for the whole input); code is a stable reason."
      properties:
        path:
          type: string
        code:
          type: string
        message:
          type: string
    ImportExactness:
      type: string
      description: "How exactly a section of an import was taken or matched (docs/specs/104). Output-only, recomputed by the server and never raised. AI_SUGGESTED is reserved and never produced."
      enum:
      - EXACT
      - NORMALISED
      - AI_SUGGESTED
      - UNRESOLVED
    ImportedResultDto:
      type: object
      description: "The common import format, version 1 (docs/specs/104): the one document an adaptor produces and the Result Processor accepts. Names, not ids; teams are referenced by key. Cricket arithmetic is ResultValidator's, not checked here. Every exactness is output-only."
      properties:
        schemaVersion:
          type: integer
          format: int32
          description: "1."
        source:
          type: object
          properties:
            adaptor:
              type: string
              enum:
              - JSON
              - CRICCLUBS_CSV
              - STUMPS_PDF
            provider:
              type: string
              maxLength: 40
            externalMatchId:
              type: string
              maxLength: 255
            fileName:
              type: string
        match:
          type: object
          properties:
            matchId:
              type: string
              format: uuid
            date:
              type: string
              format: date
            startTime:
              type: string
              example: "09:00"
            venue:
              type: string
            competition:
              type: string
            exactness:
              $ref: "#/components/schemas/ImportExactness"
        teams:
          type: array
          description: "Exactly two."
          items:
            type: object
            properties:
              key:
                type: string
                description: "1 to 8 characters of letters, digits, underscore or hyphen."
              name:
                type: string
              shortName:
                type: string
              exactness:
                $ref: "#/components/schemas/ImportExactness"
        toss:
          type: object
          properties:
            wonBy:
              type: string
            decision:
              type: string
              enum:
              - BAT
              - BOWL
            exactness:
              $ref: "#/components/schemas/ImportExactness"
        result:
          type: object
          properties:
            outcome:
              type: string
              enum:
              - WON
              - TIE
              - DRAW
              - NO_RESULT
              - ABANDONED
              - FORFEIT
            winner:
              type: string
            decidedBy:
              type: string
              enum:
              - REGULAR
              - DLS
              - SUPER_OVER
            margin:
              type: object
              properties:
                type:
                  type: string
                  enum:
                  - RUNS
                  - WICKETS
                value:
                  type: integer
                  format: int32
            dls:
              type: object
              properties:
                target:
                  type: integer
                  format: int32
                revisedOvers:
                  type: integer
                  format: int32
            scheduledOvers:
              type: integer
              format: int32
            ballsPerOver:
              type: integer
              format: int32
            note:
              type: string
            exactness:
              $ref: "#/components/schemas/ImportExactness"
        innings:
          type: array
          items:
            type: object
            properties:
              battingTeam:
                type: string
              kind:
                type: string
                enum:
                - REGULAR
                - SUPER_OVER
              runs:
                type: integer
                format: int32
              wickets:
                type: integer
                format: int32
              overs:
                type: string
                example: "36.4"
              extras:
                type: object
                properties:
                  wides:
                    type: integer
                    format: int32
                  noBalls:
                    type: integer
                    format: int32
                  byes:
                    type: integer
                    format: int32
                  legByes:
                    type: integer
                    format: int32
                  penalty:
                    type: integer
                    format: int32
              batting:
                type: array
                items:
                  type: object
                  properties:
                    player:
                      type: string
                    position:
                      type: integer
                      format: int32
                    howOut:
                      type: string
                      description: "A DismissalType."
                    bowler:
                      type: string
                    fielder:
                      type: string
                    runs:
                      type: integer
                      format: int32
                    balls:
                      type: integer
                      format: int32
                    fours:
                      type: integer
                      format: int32
                    sixes:
                      type: integer
                      format: int32
              didNotBat:
                type: array
                items:
                  type: string
              bowling:
                type: array
                items:
                  type: object
                  properties:
                    player:
                      type: string
                    overs:
                      type: string
                    maidens:
                      type: integer
                      format: int32
                    runs:
                      type: integer
                      format: int32
                    wickets:
                      type: integer
                      format: int32
                    wides:
                      type: integer
                      format: int32
                    noBalls:
                      type: integer
                      format: int32
                    dots:
                      type: integer
                      format: int32
              fallOfWickets:
                description: "Accepted and ignored."
              overByOver:
                description: "Accepted and ignored."
              exactness:
                $ref: "#/components/schemas/ImportExactness"
        players:
          type: array
          items:
            type: object
            properties:
              team:
                type: string
              name:
                type: string
              substitute:
                type: boolean
        awards:
          type: object
          properties:
            playerOfMatch:
              type: object
              properties:
                name:
                  type: string
                team:
                  type: string
            exactness:
              $ref: "#/components/schemas/ImportExactness"
    ExistingResultDto:
      type: object
      description: "A result that already exists for a match (docs/specs/104): its status and origin, whether it holds a scorecard and when it last changed."
      properties:
        matchId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - DRAFT
          - PUBLISHED
        source:
          type: string
          description: "MANUAL or IMPORT:<PROVIDER>."
        hasScorecard:
          type: boolean
        updatedAt:
          type: string
          format: date-time
    MatchCandidateDto:
      type: object
      description: "A match of the club an import could belong to, with its evidence (docs/specs/104). Nothing is ever chosen for the manager."
      properties:
        matchId:
          type: string
          format: uuid
        label:
          type: string
        matchDate:
          type: string
          format: date-time
        homeName:
          type: string
        awayName:
          type: string
        homeIsClubTeam:
          type: boolean
        awayIsClubTeam:
          type: boolean
        leagueName:
          type: string
        venue:
          type: string
        reasons:
          type: array
          items:
            type: string
            enum:
            - EXTERNAL_ID
            - GIVEN
            - DATE
            - TEAMS
            - VENUE
            - COMPETITION
        existingResult:
          $ref: "#/components/schemas/ExistingResultDto"
        deletable:
          type: boolean
          description: "True when nothing is recorded against the match, so the Match step can offer Delete (docs/specs/109)."
    TeamMappingDto:
      type: object
      description: "Which side of the chosen match a file team is (docs/specs/104). In a preview the server proposes it (side null when the team cannot be placed). In a resolve request only fileKey and side are read; the two teams must map to HOME and AWAY once each."
      properties:
        fileKey:
          type: string
        fileName:
          type: string
        side:
          type: string
          enum:
          - HOME
          - AWAY
        exactness:
          $ref: "#/components/schemas/ImportExactness"
        reason:
          type: string
        closestSide:
          type: string
          description: "A hint for a team that could not be placed: the side its name is nearest to. Never chosen for the manager."
          enum:
          - HOME
          - AWAY
    ImportNoteSuggestionDto:
      type: object
      description: "A ranked fuzzy suggestion for a name that could not be placed (docs/specs/104). Never linked automatically."
      properties:
        playerProfileId:
          type: string
          format: uuid
        displayName:
          type: string
        score:
          type: number
          format: double
    ImportNoteDto:
      type: object
      description: "One thing the import wants the manager to know (docs/specs/104). code is a stable upper-case reason; section says where it arose (match, teams, players, innings[n], awards). For a name, fileText is what the file said, candidateName who it became, level how firmly, and suggestions the ranked closest players for an unresolved name."
      properties:
        code:
          type: string
        severity:
          type: string
          enum:
          - INFO
          - WARNING
        section:
          type: string
        message:
          type: string
        fileText:
          type: string
        candidateName:
          type: string
        level:
          $ref: "#/components/schemas/ImportExactness"
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/ImportNoteSuggestionDto"
    ImportCountsDto:
      type: object
      description: "How many of our players' names were placed at each level (docs/specs/104)."
      properties:
        exact:
          type: integer
          format: int32
        normalised:
          type: integer
          format: int32
        aiSuggested:
          type: integer
          format: int32
        unresolved:
          type: integer
          format: int32
    ImportPreviewRequest:
      type: object
      description: "The request part of a preview (docs/specs/104). Exactly one of the file part and content (a paste, text based formats only). matchId when the import is launched from a match."
      properties:
        adaptor:
          type: string
          enum:
          - JSON
          - CRICCLUBS_CSV
