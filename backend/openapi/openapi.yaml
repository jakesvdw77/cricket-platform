    InningsDto:
      type: object
      description: "One innings' totals (docs/specs/100). balls is balls faced, never decimal overs; oversDisplay (e.g. 36.4) is derived on read and ignored on write. On write sequence, kind and allOut may be omitted. runs, wickets and balls are nullable (docs/specs/101): null means not entered, a draft innings may hold any subset of its figures or none (the scorecard is entered before the scores); publishing a WON, TIE or DRAW result requires all three (INNINGS_FIGURES_MISSING)."
      properties:
        sequence:
          type: integer
          format: int32
        kind:
          type: string
          enum:
          - REGULAR
          - SUPER_OVER
        battingSide:
          type: string
          enum:
          - HOME
          - AWAY
        runs:
          type: integer
          format: int32
          nullable: true
        wickets:
          type: integer
          format: int32
          nullable: true
        balls:
          type: integer
          format: int32
          nullable: true
        extras:
          type: integer
          format: int32
        allOut:
          type: boolean
        oversDisplay:
          type: string
        wides:
          type: integer
          format: int32
          description: "Extras breakdown in runs, the batting side's (docs/specs/101). When any part is present, extras is their sum; a total that disagrees is a 400 (EXTRAS_TOTAL_MISMATCH)."
        noBalls:
          type: integer
          format: int32
        byes:
          type: integer
          format: int32
        legByes:
          type: integer
          format: int32
        penaltyRuns:
          type: integer
          format: int32
        nonBowlerWickets:
          type: integer
          format: int32
          description: "Wickets not credited to a bowler in this innings (run-outs and similar); ignored when our batters are on the scorecard, where it is derived from their dismissals (docs/specs/101)."
