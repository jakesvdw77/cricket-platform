components:
  schemas:
    UpdateSubscriptionRequest:
      type: object
      properties:
        productId:
          type: string
          format: uuid
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
      required:
      - productId
    ClubSummaryDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
    PersonDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phone:
          type: string
    ProductSummaryDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        code:
          type: string
    SubscriptionDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ownerType:
          type: string
          enum:
          - CLUB
          - SECTION
        ownerId:
          type: string
          format: uuid
        club:
          $ref: "#/components/schemas/ClubSummaryDto"
        product:
          $ref: "#/components/schemas/ProductSummaryDto"
        status:
          type: string
          enum:
          - ACTIVE
          - CANCELLED
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        responsiblePerson:
          $ref: "#/components/schemas/PersonDto"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string
          format: uuid
    UpdateProductRequest:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        description:
          type: string
        isFree:
          type: boolean
        price:
          type: number
        currency:
          type: string
          maxLength: 3
          minLength: 3
        billingInterval:
          type: string
          enum:
          - MONTHLY
          - ANNUAL
        maxPeriodMonths:
          type: integer
          format: int32
        maxSections:
          type: integer
          format: int32
        maxTeams:
          type: integer
          format: int32
        maxPlayers:
          type: integer
          format: int32
        displayOrder:
          type: integer
          format: int32
        status:
          type: string
          enum:
          - DRAFT
          - ACTIVE
          - RETIRED
        showAds:
          type: boolean
        allowSubdomain:
          type: boolean
        allowWhitelisting:
          type: boolean
      required:
      - allowSubdomain
      - allowWhitelisting
      - code
      - displayOrder
      - isFree
      - name
      - showAds
      - status
    ProductDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        description:
          type: string
        isFree:
          type: boolean
        price:
          type: number
        currency:
          type: string
        billingInterval:
          type: string
          enum:
          - MONTHLY
          - ANNUAL
        maxPeriodMonths:
          type: integer
          format: int32
        maxSections:
          type: integer
          format: int32
        maxTeams:
          type: integer
          format: int32
        maxPlayers:
          type: integer
          format: int32
        status:
          type: string
          enum:
          - DRAFT
          - ACTIVE
          - RETIRED
        displayOrder:
          type: integer
          format: int32
        showAds:
          type: boolean
        allowSubdomain:
          type: boolean
        allowWhitelisting:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string
          format: uuid
    UpdateClubRequest:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
          maxLength: 63
          minLength: 3
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
      required:
      - name
      - slug
    ClubDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        status:
          type: string
          enum:
          - ONBOARDING
          - ACTIVE
          - SUSPENDED
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string
          format: uuid
    AddressDto:
      type: object
      properties:
        number:
          type: string
        street:
          type: string
        city:
          type: string
        provinceState:
          type: string
        country:
          type: string
        postalCode:
          type: string
    UpdateClubProfileRequest:
      type: object
      properties:
        type:
          type: string
          enum:
          - CLUB
          - ACADEMY
          - SCHOOL
          - OTHER
        logoUrl:
          type: string
        bannerUrl:
          type: string
        address:
          $ref: "#/components/schemas/AddressDto"
        email:
          type: string
        phone:
          type: string
        website:
          type: string
          pattern: ^https?://.+
    ClubProfileDto:
