components:
  schemas:
    SetSectionAvailabilityRoundPlayerRequest:
      type: object
      properties:
        windowId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - AVAILABLE
          - UNAVAILABLE
          - UNSURE
      required:
      - status
      - windowId
    SectionAvailabilityRoundResponseRowDto:
      type: object
      properties:
        playerProfileId:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        jerseyNumber:
          type: integer
          format: int32
        statuses:
          type: array
          items:
            $ref: "#/components/schemas/SectionAvailabilityRoundStatusDto"
    SectionAvailabilityRoundStatusDto:
      type: object
      properties:
        windowId:
          type: string
          format: uuid
        dayPart:
          type: string
          enum:
          - MORNING
          - AFTERNOON
        windowDate:
          type: string
          format: date
        status:
          type: string
          enum:
          - AVAILABLE
          - UNAVAILABLE
          - UNSURE
        viaLink:
          type: [boolean, 'null']
          description: True when the player answered through the public link (077), false or null otherwise.
    SetPlayerAvailabilityRequest:
      type: object
      properties:
        status:
          type: string
          enum:
          - AVAILABLE
          - UNAVAILABLE
          - UNSURE
      required:
      - status
    PlayerAvailabilityRowDto:
      type: object
      properties:
        playerProfileId:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        squadJerseyNumber:
          type: integer
          format: int32
        status:
          type: string
          enum:
          - AVAILABLE
          - UNAVAILABLE
          - UNSURE
        viaLink:
          type: [boolean, 'null']
          description: True when the player answered through the public link (077), false or null otherwise.
    UpdateSubscriptionRequest:
      type: object
      properties:
        productId:
          type: string
          format: uuid
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
      required:
      - productId
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri
        triesLeft:
          type: integer
          format: int32
        retryAfterSeconds:
          type: integer
          format: int64
    PublicVerifyRequest:
      type: object
      properties:
        firstName:
          type: string
          maxLength: 100
          minLength: 1
        lastName:
          type: string
          maxLength: 100
          minLength: 1
        dateOfBirth:
          type: string
          format: date
        playerId:
          type: [string, 'null']
          format: uuid
      required:
      - dateOfBirth
      - firstName
      - lastName
    PublicVerifyResponseDto:
      type: object
      description: VERIFIED sets playerId, firstName, lastName, token, expiresAt. PICK sets only candidates. NO_DATE_OF_BIRTH sets only status. Unused fields are omitted.
      properties:
        status:
          type: string
          enum:
          - VERIFIED
          - PICK
          - NO_DATE_OF_BIRTH
        playerId:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/PublicPickCandidateDto"
      required:
      - status
    PublicPickCandidateDto:
      type: object
      properties:
        playerId:
          type: string
          format: uuid
        shirtNumber:
          type: [integer, 'null']
          format: int32
        teamLabel:
          type: [string, 'null']
    PublicAnswerDto:
      type: object
      properties:
        windowId:
          type: [string, 'null']
          format: uuid
          description: Null for a squad poll, the window id for a group poll.
        status:
          type: string
          enum:
          - AVAILABLE
          - UNAVAILABLE
          - UNSURE
      required:
      - status
    PublicAnswersRequest:
      type: object
