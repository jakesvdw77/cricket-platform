        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MatchDto"
    delete:
      tags:
      - match-controller
      description: "Deletes a match with nothing recorded against it (docs/specs/109). Refused with 409 naming what exists when it has a result, an availability poll, a squad, a team selection or an availability window."
      operationId: delete
      parameters:
      - name: clubId
        in: path
        required: true
        schema:
          type: string
