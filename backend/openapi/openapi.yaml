openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:8082
  description: Generated server url
paths:
  /api/v1/platform/leads/{id}/status:
    post:
      tags:
      - lead-controller
      operationId: transitionStatus
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLeadStatusRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LeadDto"
  /api/v1/leads:
    post:
      tags:
      - lead-controller
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLeadRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LeadDto"
  /api/v1/public/clubs:
    get:
      tags:
      - public-club-controller
      operationId: search
      parameters:
      - name: query
        in: query
        required: false
        schema:
          type: string
          default: ""
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClubSummaryDto"
  /api/v1/platform/leads:
    get:
      tags:
      - lead-controller
      operationId: list
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - NEW
          - CONTACTED
          - CONVERTED
          - DISMISSED
      - name: pageable
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageLeadDto"
components:
  schemas:
    UpdateLeadStatusRequest:
      type: object
      properties:
        status:
          type: string
          enum:
          - NEW
          - CONTACTED
          - CONVERTED
          - DISMISSED
        convertedClubId:
          type: string
          format: uuid
      required:
      - status
    LeadDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        clubName:
          type: string
        phone:
          type: string
        message:
          type: string
        status:
          type: string
          enum:
          - NEW
          - CONTACTED
          - CONVERTED
          - DISMISSED
        convertedClubId:
          type: string
          format: uuid
        contactedByPersonId:
          type: string
          format: uuid
        contactedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    CreateLeadRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        clubName:
          type: string
        phone:
          type: string
        message:
          type: string
      required:
      - clubName
      - email
      - name
    ClubSummaryDto:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
    Pageable:
      type: object
      properties:
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
        sort:
          type: array
          items:
            type: string
    PageLeadDto:
      type: object
      properties:
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: "#/components/schemas/LeadDto"
        number:
          type: integer
          format: int32
        sort:
          $ref: "#/components/schemas/SortObject"
        numberOfElements:
          type: integer
          format: int32
        pageable:
          $ref: "#/components/schemas/PageableObject"
        first:
          type: boolean
        last:
          type: boolean
        empty:
          type: boolean
    PageableObject:
      type: object
      properties:
        offset:
          type: integer
          format: int64
        sort:
          $ref: "#/components/schemas/SortObject"
        pageNumber:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        paged:
          type: boolean
        unpaged:
          type: boolean
    SortObject:
      type: object
      properties:
        empty:
          type: boolean
        sorted:
          type: boolean
        unsorted:
          type: boolean
