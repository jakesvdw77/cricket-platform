openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:9082
  description: Generated server url
paths:
  /api/v1/public/polls/{pollId}:
    get:
      tags:
      - public-availability-poll-controller
      operationId: publicPollHeader
      summary: Poll header only. No players, no responses.
      parameters:
      - name: pollId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PublicPollHeaderDto"
        "404":
          description: Unknown id
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/public/polls/{pollId}/verify:
    post:
      tags:
      - public-availability-poll-controller
      operationId: publicPollVerify
      summary: >-
        Identify a player of this poll by name and date of birth. Lenient name matching, the date
        decides. VERIFIED carries a 30 minute token; PICK lists same-name same-date candidates (repeat
        with playerId); NO_DATE_OF_BIRTH means the player has no date on record. Anything else is the
        generic 403 with triesLeft. 5 failures per name lock it for 15 minutes (423); more than 30
        calls per client address per 15 minutes is 429. Both carry retryAfterSeconds.
      parameters:
      - name: pollId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicVerifyRequest"
        required: true
      responses:
        "200":
          description: VERIFIED, PICK or NO_DATE_OF_BIRTH
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PublicVerifyResponseDto"
        "400":
          description: Invalid body
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: Generic failure, property triesLeft (integer)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Unknown id
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "423":
          description: Locked, property retryAfterSeconds (integer)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "429":
          description: Too many calls from this address, property retryAfterSeconds (integer)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/public/polls/{pollId}/players/{playerId}/answers:
    get:
      tags:
      - public-availability-poll-controller
      operationId: publicPollGetAnswers
      summary: The verified player's saved answers (empty if none). Needs X-Public-Token.
      parameters:
      - name: pollId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: playerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Public-Token
        in: header
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PublicAnswersDto"
        "401":
          description: Missing, invalid, expired or wrong-scope token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Unknown id, or the player does not belong to this poll
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    put:
      tags:
      - public-availability-poll-controller
      operationId: publicPollPutAnswers
      summary: >-
        Saves all submitted answers in one transaction (source PUBLIC_LINK). Squad poll: exactly one
        answer with windowId null. Group poll: windowIds of this round, all open, partial allowed.
      parameters:
      - name: pollId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: playerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Public-Token
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicAnswersRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PublicAnswersDto"
        "400":
          description: Invalid answers
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Missing, invalid, expired or wrong-scope token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Unknown id, window of another round, or player not in the poll
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: Poll or a submitted window is closed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
