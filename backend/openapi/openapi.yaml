openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:8082
  description: Generated server url
paths:
  /api/v1/platform/leads/{id}/status:
    post:
      tags:
      - lead-controller
      operationId: transitionStatus
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLeadStatusRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LeadDto"
  /api/v1/leads:
    post:
      tags:
      - lead-controller
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLeadRequest"
        required: true
      responses:
        "201":
          description: Lead created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LeadDto"
  /api/v1/public/clubs:
    get:
      tags:
      - public-club-controller
      operationId: search
      parameters:
      - name: query
        in: query
        required: false
        schema:
          type: string
          default: ""
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClubSummaryDto"
  /api/v1/platform/me:
    get:
      tags:
      - admin-identity-controller
      operationId: me
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminIdentityDto"
  /api/v1/platform/leads:
    get:
      tags:
      - lead-controller
      operationId: list
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - NEW
          - CONTACTED
          - CONVERTED
          - DISMISSED
      - name: pageable
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageLeadDto"
  /api/v1/platform/products:
    get:
      tags:
      - product-controller
      operationId: list
      parameters:
      - name: search
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - DRAFT
          - ACTIVE
          - RETIRED
      - name: pageable
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageProductDto"
    post:
      tags:
      - product-controller
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
        required: true
      responses:
        "201":
          description: Product created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductDto"
  /api/v1/platform/products/{id}:
    get:
      tags:
      - product-controller
      operationId: get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductDto"
    put:
      tags:
      - product-controller
      operationId: update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductDto"
  /api/v1/platform/products/{id}/retire:
    post:
      tags:
      - product-controller
      operationId: retire
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductDto"
  /api/v1/platform/clubs:
    get:
      tags:
      - club-controller
      operationId: list
      parameters:
      - name: search
        in: query
        required: false
        schema:
          type: string
      - name: pageable
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageClubDto"
    post:
      tags:
      - club-controller
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClubRequest"
        required: true
      responses:
        "201":
          description: Club created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClubDto"
  /api/v1/platform/clubs/{id}:
    get:
      tags:
      - club-controller
      operationId: get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClubDto"
    put:
      tags:
      - club-controller
      operationId: update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClubRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClubDto"
  /api/v1/platform/clubs/{id}/suspend:
    post:
      tags:
      - club-controller
      operationId: suspend
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClubDto"
  /api/v1/platform/clubs/{id}/reactivate:
    post:
      tags:
      - club-controller
      operationId: reactivate
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClubDto"
  /api/v1/platform/subscriptions:
    get:
      tags:
      - subscription-controller
      operationId: list
      parameters:
      - name: search
        in: query
        required: false
        schema:
          type: string
      - name: pageable
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageSubscriptionDto"
    post:
      tags:
      - subscription-controller
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubscriptionRequest"
        required: true
      responses:
        "201":
          description: Subscription created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SubscriptionDto"
  /api/v1/platform/subscriptions/{id}:
    get:
      tags:
      - subscription-controller
      operationId: get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SubscriptionDto"
    put:
      tags:
      - subscription-controller
      operationId: update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSubscriptionRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SubscriptionDto"
  /api/v1/platform/subscriptions/{id}/cancel:
    post:
      tags:
      - subscription-controller
      operationId: cancel
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SubscriptionDto"
components:
  schemas:
    UpdateLeadStatusRequest:
      type: object
      properties:
        status:
          type: string
          enum:
          - NEW
          - CONTACTED
          - CONVERTED
          - DISMISSED
        convertedClubId:
          type: string
          format: uuid
      required:
      - status
    LeadDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        clubName:
          type: string
        phone:
          type: string
        message:
          type: string
        status:
          type: string
          enum:
          - NEW
          - CONTACTED
          - CONVERTED
          - DISMISSED
        convertedClubId:
          type: string
          format: uuid
        contactedByPersonId:
          type: string
          format: uuid
        contactedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    CreateLeadRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        clubName:
          type: string
        phone:
          type: string
        message:
          type: string
      required:
      - clubName
      - email
      - name
    ProductDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        description:
          type: string
        isFree:
          type: boolean
        price:
          type: number
        currency:
          type: string
        billingInterval:
          type: string
          enum:
          - MONTHLY
          - ANNUAL
        maxPeriodMonths:
          type: integer
          format: int32
        maxSections:
          type: integer
          format: int32
        maxTeams:
          type: integer
          format: int32
        maxPlayers:
          type: integer
          format: int32
        status:
          type: string
          enum:
          - DRAFT
          - ACTIVE
          - RETIRED
        displayOrder:
          type: integer
          format: int32
        showAds:
          type: boolean
        allowSubdomain:
          type: boolean
        allowWhitelisting:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string
          format: uuid
    CreateProductRequest:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        description:
          type: string
        isFree:
          type: boolean
        price:
          type: number
        currency:
          type: string
        billingInterval:
          type: string
          enum:
          - MONTHLY
          - ANNUAL
        maxPeriodMonths:
          type: integer
          format: int32
        maxSections:
          type: integer
          format: int32
        maxTeams:
          type: integer
          format: int32
        maxPlayers:
          type: integer
          format: int32
        displayOrder:
          type: integer
          format: int32
        showAds:
          type: boolean
        allowSubdomain:
          type: boolean
        allowWhitelisting:
          type: boolean
      required:
      - code
      - isFree
      - name
    UpdateProductRequest:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        description:
          type: string
        isFree:
          type: boolean
        price:
          type: number
        currency:
          type: string
        billingInterval:
          type: string
          enum:
          - MONTHLY
          - ANNUAL
        maxPeriodMonths:
          type: integer
          format: int32
        maxSections:
          type: integer
          format: int32
        maxTeams:
          type: integer
          format: int32
        maxPlayers:
          type: integer
          format: int32
        displayOrder:
          type: integer
          format: int32
        status:
          type: string
          enum:
          - DRAFT
          - ACTIVE
          - RETIRED
        showAds:
          type: boolean
        allowSubdomain:
          type: boolean
        allowWhitelisting:
          type: boolean
      required:
      - code
      - isFree
      - name
      - displayOrder
      - status
      - showAds
      - allowSubdomain
      - allowWhitelisting
    ClubSummaryDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
    ClubDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        status:
          type: string
          enum:
          - ONBOARDING
          - ACTIVE
          - SUSPENDED
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string
          format: uuid
    CreateClubRequest:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
      required:
      - name
      - slug
    UpdateClubRequest:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
      required:
      - name
      - slug
    ProductSummaryDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        code:
          type: string
    SubscriptionDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ownerType:
          type: string
          enum:
          - CLUB
          - SECTION
        ownerId:
          type: string
          format: uuid
        club:
          $ref: "#/components/schemas/ClubSummaryDto"
        product:
          $ref: "#/components/schemas/ProductSummaryDto"
        status:
          type: string
          enum:
          - ACTIVE
          - CANCELLED
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string
          format: uuid
    CreateSubscriptionRequest:
      type: object
      properties:
        ownerType:
          type: string
          enum:
          - CLUB
          - SECTION
        ownerId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
      required:
      - ownerId
      - ownerType
      - productId
    UpdateSubscriptionRequest:
      type: object
      properties:
        productId:
          type: string
          format: uuid
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
      required:
      - productId
    AdminIdentityDto:
      type: object
      properties:
        keycloakUserId:
          type: string
        username:
          type: string
        email:
          type: string
    Pageable:
      type: object
      properties:
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
        sort:
          type: array
          items:
            type: string
    PageLeadDto:
      type: object
      properties:
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: "#/components/schemas/LeadDto"
        number:
          type: integer
          format: int32
        sort:
          $ref: "#/components/schemas/SortObject"
        pageable:
          $ref: "#/components/schemas/PageableObject"
        numberOfElements:
          type: integer
          format: int32
        first:
          type: boolean
        last:
          type: boolean
        empty:
          type: boolean
    PageProductDto:
      type: object
      properties:
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: "#/components/schemas/ProductDto"
        number:
          type: integer
          format: int32
        sort:
          $ref: "#/components/schemas/SortObject"
        pageable:
          $ref: "#/components/schemas/PageableObject"
        numberOfElements:
          type: integer
          format: int32
        first:
          type: boolean
        last:
          type: boolean
        empty:
          type: boolean
    PageClubDto:
      type: object
      properties:
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: "#/components/schemas/ClubDto"
        number:
          type: integer
          format: int32
        sort:
          $ref: "#/components/schemas/SortObject"
        pageable:
          $ref: "#/components/schemas/PageableObject"
        numberOfElements:
          type: integer
          format: int32
        first:
          type: boolean
        last:
          type: boolean
        empty:
          type: boolean
    PageSubscriptionDto:
      type: object
      properties:
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: "#/components/schemas/SubscriptionDto"
        number:
          type: integer
          format: int32
        sort:
          $ref: "#/components/schemas/SortObject"
        pageable:
          $ref: "#/components/schemas/PageableObject"
        numberOfElements:
          type: integer
          format: int32
        first:
          type: boolean
        last:
          type: boolean
        empty:
          type: boolean
    PageableObject:
      type: object
      properties:
        offset:
          type: integer
          format: int64
        sort:
          $ref: "#/components/schemas/SortObject"
        paged:
          type: boolean
        unpaged:
          type: boolean
        pageNumber:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
    SortObject:
      type: object
      properties:
        empty:
          type: boolean
        unsorted:
          type: boolean
        sorted:
          type: boolean
