spring.application.name=cricketlegend
server.port=8082

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Keycloak — 002-realm-subdomain-auth.md's local dev convention (auth.localhost:8180); realm
# name is "cricketlegend" locally rather than 002's documented "platform-dev" — see
# docs/specs/005-admin-login.md's Flags for your review, follow-up spec edit still pending.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://auth.localhost:8180/realms/cricketlegend}
