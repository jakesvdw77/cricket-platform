spring.application.name=cricketlegend
server.port=8082

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Keycloak — 002-realm-subdomain-auth.md's local dev convention (auth.localhost:8180, realm platform-dev)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://auth.localhost:8180/realms/platform-dev}
