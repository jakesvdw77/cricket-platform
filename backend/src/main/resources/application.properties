spring.application.name=cricketlegend
server.port=8082

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Keycloak — 002-realm-subdomain-auth.md's local dev convention (auth.localhost:8180); realm
# name is "cricketlegend" locally rather than 002's documented "platform-dev" — see
# docs/specs/005-admin-login.md's Flags for your review, follow-up spec edit still pending.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://auth.localhost:8180/realms/cricketlegend}

# 012-club-profile.md's generic image-upload mechanism — local disk storage, a known, flagged
# limitation (doesn't survive/scale across multiple backend instances), not a finished decision.
app.media.storage-path=${MEDIA_STORAGE_PATH:./data/media}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Grafana Loki push endpoint — 013-centralized-logging.md. Local dev default assumes
# docker-compose.logging.yml's loki service is running on its default port.
app.logging.loki-url=${LOKI_URL:http://localhost:3100}

# Keycloak Admin API — confidential service-account client for server-to-server user
# provisioning, distinct from the public platform-web/cricketlegend SPA client used for browser
# login (002-realm-subdomain-auth.md). 016-keycloak-account-provisioning.md.
app.keycloak.admin.server-url=${KEYCLOAK_ADMIN_SERVER_URL:http://auth.localhost:8180}
app.keycloak.admin.realm=${KEYCLOAK_ADMIN_REALM:cricketlegend}
app.keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID:platform-provisioning}
app.keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET:}

# The PUBLIC SPA client id — reused only to pass as execute-actions-email's own client_id/
# redirect_uri params, so Keycloak's password-reset flow redirects back into the app rather than
# a bare Keycloak page. Same client 002/ui/src/auth/keycloak.ts already uses for login.
app.keycloak.public-client-id=${KEYCLOAK_PUBLIC_CLIENT_ID:cricketlegend}

# Base URL the frontend is served from — used only to build execute-actions-email's redirect_uri
# (.../post-login). 016-keycloak-account-provisioning.md.
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}

# Outbound SMTP for this application's own transactional email (currently: the Subscription
# welcome email below; future consumers per docs/roadmap.md: the self-serve signup OTP flow,
# 003's Invitation admin-invite email). Entirely separate from Keycloak's own realm-level Email
# settings (016) — this app authors and sends its own HTML emails, Keycloak only ever sends its
# own. Local dev default (localhost:1025, no auth, no TLS) matches Mailpit/MailHog's default SMTP
# listener out of the box — see 017-subscription-welcome-email.md Rollout Notes for the one-line
# local sink command, shared with 016's own still-unconfigured Keycloak-side email.
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}

# The address/name this app's own emails are sent from, and where a "questions?" reply should
# go. 017-subscription-welcome-email.md.
app.mail.from-address=${MAIL_FROM_ADDRESS:no-reply@cricketlegend.co.za}
app.mail.from-name=${MAIL_FROM_NAME:Cricket Legend}
app.mail.support-address=${MAIL_SUPPORT_ADDRESS:support@cricketlegend.co.za}
