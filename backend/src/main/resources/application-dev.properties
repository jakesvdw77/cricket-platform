# Separate db name from the legacy cricketlegend app so both can run locally at once
spring.datasource.url=jdbc:postgresql://localhost:5432/cricketlegend_platform
spring.datasource.username=cricket
spring.datasource.password=legend

logging.level.com.cricketlegend=DEBUG

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://auth.localhost:8180/realms/cricketlegend}

# DEV ONLY default for the public availability form's token HMAC secret (077). Never use in production:
# production must set cricketlegend.public-availability.token-secret (env CRICKETLEGEND_PUBLIC_AVAILABILITY_TOKEN_SECRET)
# to a long random value. Without any value the app still starts, using a random per-process secret.
cricketlegend.public-availability.token-secret=dev-only-insecure-public-availability-secret-change-me
